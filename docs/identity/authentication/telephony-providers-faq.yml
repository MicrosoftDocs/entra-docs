title: Frequently asked questions

summary: |
  <a id="frequently-asked-questions-about-choose-your-own-telephony-provider"></a>

  These are common questions about Choose Your Own Telephony Provider (CYOT) and Bring Your Own Telephony (BYOT) in Microsoft Entra ID. For an overview, see [Choose your own telephony provider for SMS and voice authentication](concept-telephony-providers.md). For BYOT setup, see [Set up SMS and voice with your own telephony provider by using APIs (BYOT)](bring-your-own-telephony-set-up.md).

  This FAQ covers:

  - [Provider selection and availability](#provider-selection-and-availability).
  - [Supported scenarios](#supported-scenarios).
  - [Costs and billing](#costs-and-billing).
  - [Evaluation and migration](#evaluation-and-migration).
  - [Reliability and recovery](#reliability-and-recovery).
  - [Support](#support).

sections:
- name: Provider selection and availability
  questions:
    - question: |
        Are CYOT and BYOT generally available?
      answer: |
        <a id="when-is-cyot-available"></a>
        <a id="when-will-choose-your-own-telephony-provider-be-available"></a>
        <a id="when-is-choose-your-own-telephony-provider-available"></a>

        CYOT and BYOT are generally available for Microsoft Entra ID workforce tenants in global Azure.
    - question: |
        Can I purchase a telephony provider offer in my country or region?
      answer: |
        For CYOT, check [Microsoft Marketplace geographic availability](/partner-center/marketplace-offers/marketplace-geo-availability-currencies) for purchase availability in your billing country or region. If Marketplace purchasing is unavailable, contact your Microsoft field team to discuss BYOT. For BYOT, confirm account availability and telephony coverage directly with your provider. Marketplace purchase availability is separate from telephony coverage.
    - question: |
        Which telephony providers can I use?
      answer: |
        <a id="which-telecom-providers-can-i-use"></a>
        <a id="which-telecom-providers-are-available"></a>
        <a id="which-telephony-providers-are-available"></a>
        <a id="which-telephony-providers-are-available-during-the-private-preview"></a>

        For CYOT, you can choose Soprano, Telesign, or Infobip. For coverage, pricing, and terms, see [Available telephony providers](concept-telephony-providers.md#available-telephony-providers) and each provider's [Microsoft Security Store](https://securitystore.microsoft.com/) listing. For BYOT, obtain your provider's ready-to-deploy integration package and setup instructions. See [Set up SMS and voice with your own telephony provider by using APIs (BYOT)](bring-your-own-telephony-set-up.md).
    - question: |
        Can I use my existing account with a provider?
      answer: |
        <a id="can-i-use-my-existing-sms-provider"></a>
        <a id="can-i-use-my-existing-account-with-a-supported-telephony-provider"></a>

        For both CYOT and BYOT, check with your provider. Your provider might also need its own registration, such as sender registration.
    - question: |
        Can I use a provider that isn't on the list?
      answer: |
        <a id="can-i-use-a-telephony-provider-that-isnt-listed-as-a-supported-provider"></a>

        CYOT supports the providers listed in [Available telephony providers](concept-telephony-providers.md#available-telephony-providers). Check that list for providers as they're added. Use BYOT only when regulatory, compliance, or other specific requirements call for a provider outside these offerings. Your provider must supply a ready-to-deploy integration package and setup instructions. See [Set up SMS and voice with your own telephony provider by using APIs (BYOT)](bring-your-own-telephony-set-up.md).
    - question: |
        Can I use different providers for SMS and voice?
      answer: |
        <a id="can-i-configure-multiple-telephony-providers"></a>

        Yes. For CYOT and BYOT, you can use one provider for SMS and another for voice, subject to the channels supported by each provider and its integration.

- name: Supported scenarios
  questions:
    - question: |
        Which Microsoft Entra products support CYOT and BYOT?
      answer: |
        <a id="which-microsoft-entra-products-support-cyot"></a>
        <a id="does-this-work-with-microsoft-entra-id-microsoft-entra-external-id-and-azure-ad-b2c"></a>
        <a id="which-authentication-scenarios-support-cyot"></a>

        CYOT and BYOT are available for Microsoft Entra ID workforce tenants. Neither is currently available for Microsoft Entra External ID or Azure AD B2C.
    - question: |
        Can I use CYOT or BYOT for SMS sign-in as a primary method?
      answer: |
        <a id="can-i-use-cyot-for-sms-sign-in-as-a-primary-method"></a>
        <a id="can-i-use-choose-your-own-telephony-provider-to-keep-sms-sign-in-as-a-primary-authentication-method"></a>
        <a id="can-i-use-cyot-for-sms-sign-in-as-a-primary-authentication-method"></a>

        No. CYOT and BYOT support SMS and voice as verification methods, not as primary sign-in. Move users who sign in with SMS to another supported method.

        > [!IMPORTANT]
        > Microsoft recommends phishing-resistant methods such as [passkeys](concept-authentication-passkeys-fido2.md). Use SMS or voice only for users with a business, regulatory, or technical need for it.

- name: Costs and billing
  questions:
    - question: |
        How much do CYOT and BYOT cost?
      answer: |
        <a id="how-much-does-cyot-cost"></a>
        <a id="do-budget-alerts-stop-charges"></a>
        <a id="how-much-does-choose-your-own-telephony-provider-cost"></a>

        Plan for two costs:

        - **Provider costs:** For CYOT, SMS and voice charges are set by your provider's offer on [Microsoft Security Store](https://securitystore.microsoft.com/). For BYOT, charges follow the commercial terms you agree directly with your provider.
        - **Azure costs:** the resources that host the integration in your subscription.

        For estimates, see [Estimate telephony provider and Azure hosting costs](https://github.com/Azure-Samples/ExternalPhoneProvider-AzureFunction-Sample/blob/main/docs/COST-CALCULATOR.md).
    - question: |
        Does Microsoft charge me for SMS and voice sent through my provider?
      answer: |
        <a id="does-microsoft-bill-me-for-sms-and-voice-sent-through-my-telephony-provider"></a>

        For CYOT, your provider sets SMS and voice charges under the offer you purchase in [Microsoft Security Store](https://securitystore.microsoft.com/). For BYOT, charges follow the terms you agree directly with your provider. For both options, Azure hosting costs are billed to your Azure subscription.

- name: Evaluation and migration
  questions:
    - question: |
        How do I move to my own telephony provider?
      answer: |
        <a id="migration-and-evaluation"></a>
        <a id="how-do-i-migrate"></a>
        <a id="do-i-deploy-another-endpoint-for-voice-after-setting-up-sms"></a>
        <a id="how-do-i-move-to-my-own-telecom-provider"></a>
        <a id="do-i-need-to-change-my-existing-sms-or-voice-user-targeting-to-use-cyot"></a>

        For CYOT:

        1. Subscribe to a provider offer in [Microsoft Security Store](https://securitystore.microsoft.com/).
        1. Set up the integration in your Azure subscription.
        1. Create an SMS and voice profile.
        1. Evaluate the integration.
        1. Roll out traffic to your provider.

        For details, see [Set up SMS and voice with your own telephony provider in the Microsoft Entra admin center (CYOT)](choose-your-own-telephony-set-up.md).

        For BYOT, set up your account directly with your provider, deploy its published integration, and configure the authentication method policy through APIs. See [Set up SMS and voice with your own telephony provider by using APIs (BYOT)](bring-your-own-telephony-set-up.md). For both options, preserve existing production SMS and voice targets. Test targeting changes in a test tenant.
    - question: |
        Can I test CYOT or BYOT before I move traffic?
      answer: |
        <a id="can-i-test-cyot-before-i-move-traffic"></a>
        <a id="can-i-evaluate-before-switching-my-users-to-a-new-provider"></a>
        <a id="can-i-test-cyot-before-moving-authentication-delivery-to-my-provider"></a>

        Yes. Evaluation mode sends requests to your integration while Microsoft continues to deliver codes to users. For CYOT, set the **Evaluation sampling percentage** in your profile, then switch to **Production** at a low traffic percentage to test provider delivery. For BYOT, set `isEvaluationModeEnabled` to `true` and use `migrationPercentage` for evaluation sampling. To test provider credentials and actual delivery, set `isEvaluationModeEnabled` to `false` with a low `migrationPercentage`. See [Set up SMS and voice with your own telephony provider by using APIs (BYOT)](bring-your-own-telephony-set-up.md#step-5-test-the-integration).
    - question: |
        Can I move traffic gradually?
      answer: |
        <a id="can-i-move-traffic-to-my-provider-gradually"></a>

        Yes. For CYOT, increase the **Traffic routed through provider percentage** in stages. For BYOT, increase `migrationPercentage` with `isEvaluationModeEnabled` set to `false`. For both options, check results before each increase and preserve existing production targets.
    - question: |
        How long do policy changes take to apply?
      answer: |
        Changes to the authentication methods policy can take up to about an hour to apply.
    - question: |
        I lost the setup output when Cloud Shell closed. What do I do?
      answer: |
        Copy the deployment summary as soon as the script finishes. Cloud Shell sessions are temporary and can close when you switch tabs. If you lost it, find the deployed resources in the Azure portal.

- name: Reliability and recovery
  questions:
    - question: |
        What should I do if SMS or voice codes aren't arriving?
      answer: |
        <a id="is-microsoft-managed-delivery-a-permanent-recovery-option"></a>
        <a id="what-happens-if-cyot-production-delivery-fails"></a>
        <a id="where-do-i-start-if-authentication-isnt-working"></a>

        If you're partway through a rollout, pause it. Then use [Monitor and troubleshoot SMS and voice with your own telephony provider](choose-your-own-telephony-troubleshoot.md#monitor-and-troubleshoot-your-own-telephony-provider) to find where the request stopped and who to contact.
    - question: |
        How do I plan for high availability?
      answer: |
        <a id="how-should-i-plan-for-higher-availability"></a>

        You can deploy the integration across multiple Azure regions, review your provider's redundancy, and add a secondary provider. The multi-region and secondary-provider designs are sample-only guidance. Test failover before you rely on it. See [Plan for resiliency and high availability](choose-your-own-telephony-reliability.md).

- name: Support
  questions:
    - question: |
        Who manages each part of CYOT and BYOT?
      answer: |
        <a id="who-manages-each-part-of-cyot"></a>
        <a id="support-and-troubleshooting"></a>
        <a id="who-operates-the-cyot-integration"></a>

        | Owner | Responsibility |
        |---|---|
        | Microsoft | Microsoft Entra authentication and the handoff to your endpoint |
        | Your organization | Deploying and running the integration, managing the provider account, and renewing integration credentials and certificates |
        | Telephony provider | SMS and voice delivery, and fraud controls |
    - question: |
        Who do I contact for help?
      answer: |
        <a id="what-is-the-support-model"></a>
        <a id="what-does-microsoft-support"></a>
        <a id="when-should-i-contact-my-telephony-provider"></a>

        | Issue | Contact |
        |---|---|
        | Microsoft Entra authentication, code validation, or the handoff to your endpoint | [Microsoft Support](/entra/fundamentals/how-to-get-support) |
        | Your Azure Function or Azure resources | Your Azure team |
        | Delivery, sender registration, destinations, fraud controls, or charges | Your telephony provider. For CYOT, use its [Security Store](https://securitystore.microsoft.com/) listing. For BYOT, use support details supplied directly by your provider. |

