title: Migrate from Microsoft Entra Connect Sync to Cloud Sync FAQ
summary: |
  This article answers frequently asked questions about migrating from Microsoft Entra Connect Sync to Microsoft Entra Cloud Sync. For platform capabilities, see the [decision guide](connect-to-cloud-sync-decision-guide.md). For guided-tool eligibility and procedures, see the [guided migration tool](migrate-connect-sync-cloud-sync-tool.md#prerequisites). To choose a guided or documented manual path, see [Choose a migration path](migrate-azure-ad-connect-to-cloud-sync.md#choose-a-migration-path).

sections:
  - name: Migration eligibility and timeline
    questions:
      - question: |
          How will I know when it's my turn to migrate to Cloud Sync?
        answer: |
          Microsoft notifies your organization when it becomes eligible to begin migration. Eligibility is determined by factors including your current configuration and supported scenarios, and migration is rolled out in phases. When it's time, you receive clear instructions through official communication channels on how to proceed.

      - question: |
          What if my organization can't migrate within the recommended window?
        answer: |
          If a confirmed technical or business blocker prevents migration by the date in your tenant-specific notification, [request more time through Microsoft Support](migrate-connect-sync-cloud-sync-tool.md#request-more-time-to-migrate). Exception requests are reviewed individually, aren't guaranteed, and don't remove the requirement to migrate.

      - question: |
          Why do I see different dates?
        answer: |
          Cloud Sync migration deadlines and windows are organization-specific. Connect Sync version retirement, authentication changes, and other product changes can have different timelines. Follow the migration date in your organization's tenant-specific notification. For exception timing and required evidence, see [Request more time to migrate](migrate-connect-sync-cloud-sync-tool.md#request-more-time-to-migrate).

      - question: |
          How long does migration take?
        answer: |
          Migration time varies with your environment and readiness results. Plan separately for:

          - **Readiness remediation:** Review and resolve the conditions identified by the [readiness assessment](migrate-connect-sync-cloud-sync-tool.md#review-environment-readiness).
          - **Configuration transfer:** The tool transfers only supported settings and creates the required Cloud Sync configurations and jobs.
          - **Initial synchronization:** After activation, Cloud Sync starts initial synchronization. Review job health and synchronization results.
          - **Validation:** Keep Connect Sync installed during the documented [two-week validation period](migrate-connect-sync-cloud-sync-tool.md#validate-synchronization-results), and manually validate objects, references, and enabled writeback scenarios.

  - name: Migration process
    questions:
      - question: |
          How do I migrate from Connect Sync to Cloud Sync?
        answer: |
          To prepare for migration, explore the following resources:

          - [What is Cloud Sync](what-is-cloud-sync.md)
          - [Cloud Sync deep dive - how it works](concept-how-it-works.md)
          - [Guided migration-tool prerequisites and limits](migrate-connect-sync-cloud-sync-tool.md#prerequisites)
          - [Step-by-step migration guidance](migrate-azure-ad-connect-to-cloud-sync.md)

          **Migration scenarios:**

          - [Migrate to Microsoft Entra Cloud Sync for a synced Active Directory forest](tutorial-pilot-aadc-aadccp.md)
          - [Migrate Microsoft Entra Connect Sync group writeback v2 to Microsoft Entra Cloud Sync](migrate-group-writeback.md)
          - [Microsoft Entra Cloud Sync vs. Microsoft Entra Connect Sync feature comparison](connect-to-cloud-sync-decision-guide.md#comparison-between-microsoft-entra-connect-and-cloud-sync)

      - question: |
          Can I run Connect Sync and Cloud Sync side by side?
        answer: |
          Connect Sync and Cloud Sync must not simultaneously export normal changes for the same object and attribute set. During the documented manual phased-migration process, objects remain in Connect Sync scope while the `cloudNoFlow` and `JoinNoFlow` rules prevent normal Connect Sync exports and preserve required references. Follow the [manual migration procedure](tutorial-pilot-aadc-aadccp.md#create-a-custom-user-inbound-rule), and remove Connect Sync scope only after migration and [reference validation](tutorial-pilot-aadc-aadccp.md#plan-scope-removal-from-microsoft-entra-connect-sync) are complete.

      - question: |
          Why can't I see the Transition to Cloud Sync option?
        answer: |
          Check the [guided migration-tool prerequisites](migrate-connect-sync-cloud-sync-tool.md#prerequisites):

          - Start the task on the active Connect Sync server, not a server in staging mode.
          - Use a supported Connect Sync version on the active installation.
          - Your organization and installation must be eligible for the current migration wave.

      - question: |
          What does the migration tool validate?
        answer: |
          The tool assesses readiness and transfers supported configurations. Before activation, complete [Provision on Demand](migrate-connect-sync-cloud-sync-tool.md#verify-the-configuration-with-provision-on-demand) for each migrated domain configuration. After activation, the wizard compares an aggregate **Total Objects** count, checks required Cloud Sync job health, and confirms that Connect Sync is in staging mode.

          Individual users, groups, memberships, manager relationships, password hash synchronization results, writeback operations, and business-specific outcomes require manual validation. Follow the [validation checklist](migrate-connect-sync-cloud-sync-tool.md#what-the-migration-tool-does-not-validate-automatically).

      - question: |
          Can I test migration before fully rolling it out?
        answer: |
          Yes. You can pilot the migration using a test Active Directory forest before committing to a full rollout. The tutorial [Migrate to Microsoft Entra Cloud Sync for a synced Active Directory forest](tutorial-pilot-aadc-aadccp.md) walks you through a sandbox migration. You can also use [on-demand provisioning](how-to-on-demand-provision.md) to validate configuration changes by applying them to a single user.

  - name: Configuration and customization
    questions:
      - question: |
          Will my existing configurations be preserved during migration?
        answer: |
          During [guided-tool activation](migrate-connect-sync-cloud-sync-tool.md#activate-cloud-sync), the tool enables Cloud Sync and places Connect Sync in staging mode. Keep Connect Sync installed during the documented validation period. For manual migration, [back up your Connect Sync configuration](tutorial-pilot-aadc-aadccp.md#back-up-your-microsoft-entra-connect-configuration) before making changes by using the [import and export settings](../connect/how-to-connect-import-export-config.md) feature.

      - question: |
          Will customizations carry over automatically?
        answer: |
          Only supported configurations are transferred. Review the [tool prerequisites](migrate-connect-sync-cloud-sync-tool.md#prerequisites) and [readiness result](migrate-connect-sync-cloud-sync-tool.md#review-environment-readiness), then validate the transferred configuration. Complete [on-demand provisioning](how-to-on-demand-provision.md) before activation as described in [Verify the configuration with Provision on Demand](migrate-connect-sync-cloud-sync-tool.md#verify-the-configuration-with-provision-on-demand). After activation, follow the [validation guidance](migrate-connect-sync-cloud-sync-tool.md#validate-synchronization-results). The [feature comparison](connect-to-cloud-sync-decision-guide.md#comparison-between-microsoft-entra-connect-and-cloud-sync) describes platform capabilities, not automatic transfer support.

  - name: Feature support and compatibility
    questions:
      - question: |
          Why can Cloud Sync support a feature that the guided migration tool blocks?
        answer: |
          The [decision guide](connect-to-cloud-sync-decision-guide.md#comparison-between-microsoft-entra-connect-and-cloud-sync) describes Cloud Sync platform capabilities. The [migration-tool prerequisites and limits](migrate-connect-sync-cloud-sync-tool.md#prerequisites) describe what the current guided experience can assess and transfer. A supported Cloud Sync capability doesn't automatically mean that the guided tool can migrate it. Use a documented manual migration procedure only when one is available for your scenario. Otherwise, continue using Connect Sync.

      - question: |
          Cloud Sync supports device synchronization. Why does the migration tool block my environment?
        answer: |
          Cloud Sync supports device synchronization, but the guided migration tool currently lists it as a blocking condition. Don't remove required Device Sync configuration to bypass readiness. Review the [decision guide](connect-to-cloud-sync-decision-guide.md#comparison-between-microsoft-entra-connect-and-cloud-sync), [tool requirements](migrate-connect-sync-cloud-sync-tool.md#prerequisites), and [Device Sync documentation](device-sync.md) before planning migration. The Device Sync article describes configuration, not a device migration sequence.

      - question: |
          Which Connect Sync features are currently supported in Cloud Sync?
        answer: |
          For a full feature comparison, see the [Connect Sync to Cloud Sync decision guide](connect-to-cloud-sync-decision-guide.md#comparison-between-microsoft-entra-connect-and-cloud-sync). The decision guide includes a detailed comparison table covering 40+ capabilities and their availability in Cloud Sync.

      - question: |
          What happens if I rely on features that aren't yet available in Cloud Sync?
        answer: |
          Review the [decision guide](connect-to-cloud-sync-decision-guide.md#decision-framework) to identify unsupported requirements. Continue using Connect Sync when a required capability or documented migration procedure isn't available. If you've received a migration notification and a confirmed blocker prevents you from meeting its deadline, [request more time through Microsoft Support](migrate-connect-sync-cloud-sync-tool.md#request-more-time-to-migrate). An exception isn't automatic or guaranteed.

      - question: |
          What happens to hybrid authentication features like Pass-Through Authentication (PTA)?
        answer: |
          Once you migrate to Cloud Sync, your hybrid authentication features that enable on-premises credentials to be used for accessing cloud resources continue to be available. Features like [Pass-Through Authentication](../connect/how-to-connect-pta.md) and [seamless single sign-on](../connect/how-to-connect-sso.md) are configured separately from the sync tool and remain functional after migration through the Connect Sync configuration wizard.
