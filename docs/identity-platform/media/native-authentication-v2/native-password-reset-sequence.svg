<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2024" viewBox="0 0 1120 2024" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Representative native authentication password-reset sequence</title>
<desc id="diagram-description">Standalone password recovery starts authorization, verifies an offered email recovery method, updates the password, polls when required, and completes remaining policy interactions before authorization resumes.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#243746"/></marker></defs>
<style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#16324f;font-size:18px}
.heading{font-size:21px;font-weight:600}.actor{fill:#eaf3fb;stroke:#315a7d;stroke-width:1.6}.actor-text{font-weight:600}
.lifeline{stroke:#75899a;stroke-width:1.3;stroke-dasharray:6 5}.request,.reply{fill:none;stroke:#243746;stroke-width:1.8}
.reply{stroke-dasharray:6 4}.group{fill:#f7faff;stroke:#8094a6;stroke-width:1.3}.group-label{font-size:17px;font-weight:600}
.message{paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}.group-label{paint-order:stroke;stroke:#f7faff;stroke-width:6px;stroke-linejoin:round}
.separator{stroke:#8094a6;stroke-dasharray:5 4}.note{fill:#fff8df;stroke:#8b753a}.note-text{font-size:17px}
.footer{font-size:16px}
</style>
<rect width="1120" height="2024" fill="white"/>
<text class="heading" x="25" y="30" text-anchor="start"><tspan x="25" dy="0">Representative native authentication password-reset sequence</tspan></text>
<rect class="group" x="25" y="1222" width="1070" height="186" rx="3"/><text class="group-label" x="37" y="1249" text-anchor="start"><tspan x="37" dy="0">loop: While action is poll</tspan></text>
<rect class="group" x="25" y="1434" width="1070" height="186" rx="3"/><text class="group-label" x="37" y="1461" text-anchor="start"><tspan x="37" dy="0">opt: When additional authentication is required</tspan></text>
<line class="lifeline" x1="120" y1="126" x2="120" y2="1979"/><rect class="actor" x="40" y="56" width="160" height="70" rx="5"/><text class="actor-text" x="120" y="98" text-anchor="middle"><tspan x="120" dy="0">User</tspan></text>
<line class="lifeline" x1="520" y1="126" x2="520" y2="1979"/><rect class="actor" x="405" y="56" width="230" height="70" rx="5"/><text class="actor-text" x="520" y="98" text-anchor="middle"><tspan x="520" dy="0">Client application</tspan></text>
<line class="lifeline" x1="960" y1="126" x2="960" y2="1979"/><rect class="actor" x="830" y="56" width="260" height="70" rx="5"/><text class="actor-text" x="960" y="86" text-anchor="middle"><tspan x="960" dy="0">Native Authentication</tspan><tspan x="960" dy="23">API</tspan></text>
<text class="message" x="320" y="172" text-anchor="middle"><tspan x="320" dy="0">Start password recovery</tspan></text>
<line class="request" x1="120" y1="201" x2="520" y2="201" marker-end="url(#arrow)"/>
<text class="message" x="740" y="245" text-anchor="middle"><tspan x="740" dy="0">Start authorization challenge</tspan></text>
<line class="request" x1="520" y1="274" x2="960" y2="274" marker-end="url(#arrow)"/>
<text class="message" x="740" y="318" text-anchor="middle"><tspan x="740" dy="0">401: continuation_token and reset-password</tspan><tspan x="740" dy="23">link</tspan></text>
<line class="reply" x1="960" y1="370" x2="520" y2="370" marker-end="url(#arrow)"/>
<text class="message" x="740" y="414" text-anchor="middle"><tspan x="740" dy="0">Start recovery with identifier and current</tspan><tspan x="740" dy="23">token</tspan></text>
<line class="request" x1="520" y1="466" x2="960" y2="466" marker-end="url(#arrow)"/>
<text class="message" x="740" y="510" text-anchor="middle"><tspan x="740" dy="0">Offered recovery methods and challenge links</tspan></text>
<line class="reply" x1="960" y1="539" x2="520" y2="539" marker-end="url(#arrow)"/>
<text class="message" x="740" y="583" text-anchor="middle"><tspan x="740" dy="0">Challenge an offered recovery method</tspan></text>
<line class="request" x1="520" y1="612" x2="960" y2="612" marker-end="url(#arrow)"/>
<text class="message" x="540" y="656" text-anchor="middle"><tspan x="540" dy="0">Email recovery passcode delivery</tspan></text>
<line class="reply" x1="960" y1="685" x2="120" y2="685" marker-end="url(#arrow)"/>
<text class="message" x="740" y="729" text-anchor="middle"><tspan x="740" dy="0">Verify action and allowed link</tspan></text>
<line class="reply" x1="960" y1="758" x2="520" y2="758" marker-end="url(#arrow)"/>
<text class="message" x="320" y="802" text-anchor="middle"><tspan x="320" dy="0">Requested recovery passcode</tspan></text>
<line class="request" x1="120" y1="831" x2="520" y2="831" marker-end="url(#arrow)"/>
<text class="message" x="740" y="875" text-anchor="middle"><tspan x="740" dy="0">Verify recovery passcode</tspan></text>
<line class="request" x1="520" y1="904" x2="960" y2="904" marker-end="url(#arrow)"/>
<text class="message" x="740" y="948" text-anchor="middle"><tspan x="740" dy="0">Update action and allowed link</tspan></text>
<line class="reply" x1="960" y1="977" x2="520" y2="977" marker-end="url(#arrow)"/>
<text class="message" x="320" y="1021" text-anchor="middle"><tspan x="320" dy="0">Replacement password</tspan></text>
<line class="request" x1="120" y1="1050" x2="520" y2="1050" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1094" text-anchor="middle"><tspan x="740" dy="0">Update password with the current token</tspan></text>
<line class="request" x1="520" y1="1123" x2="960" y2="1123" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1167" text-anchor="middle"><tspan x="740" dy="0">Current state and next action</tspan></text>
<line class="reply" x1="960" y1="1196" x2="520" y2="1196" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1282" text-anchor="middle"><tspan x="740" dy="0">Poll the returned update operation</tspan></text>
<line class="request" x1="520" y1="1311" x2="960" y2="1311" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1355" text-anchor="middle"><tspan x="740" dy="0">Current state and next action</tspan></text>
<line class="reply" x1="960" y1="1384" x2="520" y2="1384" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1494" text-anchor="middle"><tspan x="740" dy="0">Complete the returned policy interactions</tspan></text>
<line class="request" x1="520" y1="1523" x2="960" y2="1523" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1567" text-anchor="middle"><tspan x="740" dy="0">State: continue and allowed link</tspan></text>
<line class="reply" x1="960" y1="1596" x2="520" y2="1596" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1664" text-anchor="middle"><tspan x="740" dy="0">Follow continue link with continuation_token</tspan></text>
<line class="request" x1="520" y1="1693" x2="960" y2="1693" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1737" text-anchor="middle"><tspan x="740" dy="0">Authorization code</tspan></text>
<line class="reply" x1="960" y1="1766" x2="520" y2="1766" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1810" text-anchor="middle"><tspan x="740" dy="0">Exchange authorization code at token</tspan><tspan x="740" dy="23">endpoint</tspan></text>
<line class="request" x1="520" y1="1862" x2="960" y2="1862" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1906" text-anchor="middle"><tspan x="740" dy="0">Tokens</tspan></text>
<line class="reply" x1="960" y1="1935" x2="520" y2="1935" marker-end="url(#arrow)"/>
<text class="footer" x="25" y="2010" text-anchor="start"><tspan x="25" dy="0">Representative successful path. Follow the current response rather than a fixed sequence.</tspan></text>
</svg>
