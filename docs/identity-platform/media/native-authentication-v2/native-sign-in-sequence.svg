<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1782" viewBox="0 0 1120 1782" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Representative native authentication sign-in sequence</title>
<desc id="diagram-description">Sign-in starts authorization and identifier discovery, challenges and verifies an offered method, completes any additional policy interactions, and resumes authorization before token exchange.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#243746"/></marker></defs>
<style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#16324f;font-size:18px}
.heading{font-size:21px;font-weight:600}.actor{fill:#eaf3fb;stroke:#315a7d;stroke-width:1.6}.actor-text{font-weight:600}
.lifeline{stroke:#75899a;stroke-width:1.3;stroke-dasharray:6 5}.request,.reply{fill:none;stroke:#243746;stroke-width:1.8}
.reply{stroke-dasharray:6 4}.group{fill:#f7faff;stroke:#8094a6;stroke-width:1.3}.group-label{font-size:17px;font-weight:600}
.message{paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}.group-label{paint-order:stroke;stroke:#f7faff;stroke-width:6px;stroke-linejoin:round}
.separator{stroke:#8094a6;stroke-dasharray:5 4}.note{fill:#fff8df;stroke:#8b753a}.note-text{font-size:17px}
.footer{font-size:16px}
</style>
<rect width="1120" height="1782" fill="white"/>
<text class="heading" x="25" y="30" text-anchor="start"><tspan x="25" dy="0">Representative native authentication sign-in sequence</tspan></text>
<rect class="group" x="25" y="665" width="1070" height="113" rx="3"/><text class="group-label" x="37" y="692" text-anchor="start"><tspan x="37" dy="0">opt: When an email one-time passcode is required</tspan></text>
<rect class="group" x="25" y="1169" width="1070" height="209" rx="3"/><text class="group-label" x="37" y="1196" text-anchor="start"><tspan x="37" dy="0">loop: While additional policy interactions are required</tspan></text>
<line class="lifeline" x1="120" y1="126" x2="120" y2="1737"/><rect class="actor" x="40" y="56" width="160" height="70" rx="5"/><text class="actor-text" x="120" y="98" text-anchor="middle"><tspan x="120" dy="0">User</tspan></text>
<line class="lifeline" x1="520" y1="126" x2="520" y2="1737"/><rect class="actor" x="405" y="56" width="230" height="70" rx="5"/><text class="actor-text" x="520" y="98" text-anchor="middle"><tspan x="520" dy="0">Client application</tspan></text>
<line class="lifeline" x1="960" y1="126" x2="960" y2="1737"/><rect class="actor" x="830" y="56" width="260" height="70" rx="5"/><text class="actor-text" x="960" y="86" text-anchor="middle"><tspan x="960" dy="0">Native Authentication</tspan><tspan x="960" dy="23">API</tspan></text>
<text class="message" x="740" y="172" text-anchor="middle"><tspan x="740" dy="0">Start authorization challenge</tspan></text>
<line class="request" x1="520" y1="201" x2="960" y2="201" marker-end="url(#arrow)"/>
<text class="message" x="740" y="245" text-anchor="middle"><tspan x="740" dy="0">401: continuation_token and sign_in link</tspan></text>
<line class="reply" x1="960" y1="274" x2="520" y2="274" marker-end="url(#arrow)"/>
<text class="message" x="320" y="318" text-anchor="middle"><tspan x="320" dy="0">Request sign-in identifier</tspan></text>
<line class="reply" x1="520" y1="347" x2="120" y2="347" marker-end="url(#arrow)"/>
<text class="message" x="320" y="391" text-anchor="middle"><tspan x="320" dy="0">Sign-in identifier</tspan></text>
<line class="request" x1="120" y1="420" x2="520" y2="420" marker-end="url(#arrow)"/>
<text class="message" x="740" y="464" text-anchor="middle"><tspan x="740" dy="0">Discover methods through sign_in link</tspan></text>
<line class="request" x1="520" y1="493" x2="960" y2="493" marker-end="url(#arrow)"/>
<text class="message" x="740" y="537" text-anchor="middle"><tspan x="740" dy="0">Offered methods and challenge links</tspan></text>
<line class="reply" x1="960" y1="566" x2="520" y2="566" marker-end="url(#arrow)"/>
<text class="message" x="740" y="610" text-anchor="middle"><tspan x="740" dy="0">Challenge an offered method</tspan></text>
<line class="request" x1="520" y1="639" x2="960" y2="639" marker-end="url(#arrow)"/>
<text class="message" x="540" y="725" text-anchor="middle"><tspan x="540" dy="0">Email passcode delivery</tspan></text>
<line class="reply" x1="960" y1="754" x2="120" y2="754" marker-end="url(#arrow)"/>
<text class="message" x="740" y="822" text-anchor="middle"><tspan x="740" dy="0">Verify action and allowed link</tspan></text>
<line class="reply" x1="960" y1="851" x2="520" y2="851" marker-end="url(#arrow)"/>
<text class="message" x="320" y="895" text-anchor="middle"><tspan x="320" dy="0">Request password or passcode</tspan></text>
<line class="reply" x1="520" y1="924" x2="120" y2="924" marker-end="url(#arrow)"/>
<text class="message" x="320" y="968" text-anchor="middle"><tspan x="320" dy="0">Requested credential</tspan></text>
<line class="request" x1="120" y1="997" x2="520" y2="997" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1041" text-anchor="middle"><tspan x="740" dy="0">Verify with the current continuationToken</tspan></text>
<line class="request" x1="520" y1="1070" x2="960" y2="1070" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1114" text-anchor="middle"><tspan x="740" dy="0">Next state, action, links, and token</tspan></text>
<line class="reply" x1="960" y1="1143" x2="520" y2="1143" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1229" text-anchor="middle"><tspan x="740" dy="0">Handle returned challenge, verify, enroll,</tspan><tspan x="740" dy="23">or activate</tspan></text>
<line class="request" x1="520" y1="1281" x2="960" y2="1281" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1325" text-anchor="middle"><tspan x="740" dy="0">Next action or state: continue</tspan></text>
<line class="reply" x1="960" y1="1354" x2="520" y2="1354" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1422" text-anchor="middle"><tspan x="740" dy="0">Follow continue link with continuation_token</tspan></text>
<line class="request" x1="520" y1="1451" x2="960" y2="1451" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1495" text-anchor="middle"><tspan x="740" dy="0">Authorization code</tspan></text>
<line class="reply" x1="960" y1="1524" x2="520" y2="1524" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1568" text-anchor="middle"><tspan x="740" dy="0">Exchange authorization code at token</tspan><tspan x="740" dy="23">endpoint</tspan></text>
<line class="request" x1="520" y1="1620" x2="960" y2="1620" marker-end="url(#arrow)"/>
<text class="message" x="740" y="1664" text-anchor="middle"><tspan x="740" dy="0">Tokens</tspan></text>
<line class="reply" x1="960" y1="1693" x2="520" y2="1693" marker-end="url(#arrow)"/>
<text class="footer" x="25" y="1768" text-anchor="start"><tspan x="25" dy="0">Representative successful path. Follow the current response rather than a fixed sequence.</tspan></text>
</svg>
