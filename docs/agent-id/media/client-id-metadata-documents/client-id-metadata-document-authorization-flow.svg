<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title description">
  <title id="title">Client ID Metadata Document authorization flow with Microsoft Entra ID</title>
  <desc id="description">Swimlane diagram for a user, MCP client, Microsoft Entra ID, CIMD host, and MCP server. The MCP client discovers the authorization server, uses the metadata document URL as its client ID, receives a token from Microsoft Entra ID, and calls the MCP server.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#323130"/>
    </marker>
    <style>
      .background { fill: #ffffff; }
      .lane-a { fill: #f8f9fa; }
      .lane-b { fill: #ffffff; }
      .header { fill: #e8f3fc; stroke: #8a8886; stroke-width: 1; }
      .header-entra { fill: #dff6dd; stroke: #8a8886; stroke-width: 1; }
      .header-text { fill: #201f1e; font: 600 18px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .label { fill: #201f1e; font: 16px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .small-label { fill: #201f1e; font: 15px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .lifeline { stroke: #a19f9d; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .arrow { fill: none; stroke: #323130; stroke-width: 2; marker-end: url(#arrow); }
      .action { fill: #f3f2f1; stroke: #605e5c; stroke-width: 1.5; rx: 8; }
      .action-text { fill: #201f1e; font: 15px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .step { fill: #0078d4; }
      .step-text { fill: #ffffff; font: 600 14px "Segoe UI", Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="background" width="1200" height="930"/>
  <rect class="lane-a" x="20" y="80" width="160" height="820"/>
  <rect class="lane-b" x="180" y="80" width="230" height="820"/>
  <rect class="lane-a" x="410" y="80" width="280" height="820"/>
  <rect class="lane-b" x="690" y="80" width="230" height="820"/>
  <rect class="lane-a" x="920" y="80" width="260" height="820"/>

  <rect class="header" x="20" y="20" width="160" height="60"/>
  <rect class="header" x="180" y="20" width="230" height="60"/>
  <rect class="header-entra" x="410" y="20" width="280" height="60"/>
  <rect class="header" x="690" y="20" width="230" height="60"/>
  <rect class="header" x="920" y="20" width="260" height="60"/>
  <text class="header-text" x="100" y="57">User</text>
  <text class="header-text" x="295" y="57">MCP client</text>
  <text class="header-text" x="550" y="57">Microsoft Entra ID</text>
  <text class="header-text" x="805" y="57">CIMD host</text>
  <text class="header-text" x="1050" y="57">MCP server</text>

  <line class="lifeline" x1="100" y1="80" x2="100" y2="900"/>
  <line class="lifeline" x1="295" y1="80" x2="295" y2="900"/>
  <line class="lifeline" x1="550" y1="80" x2="550" y2="900"/>
  <line class="lifeline" x1="805" y1="80" x2="805" y2="900"/>
  <line class="lifeline" x1="1050" y1="80" x2="1050" y2="900"/>

  <circle class="step" cx="100" cy="115" r="15"/>
  <text class="step-text" x="100" y="115">1</text>
  <line class="arrow" x1="130" y1="150" x2="285" y2="150"/>
  <text class="label" x="207" y="137">Connect to MCP server</text>

  <circle class="step" cx="315" cy="200" r="15"/>
  <text class="step-text" x="315" y="200">2</text>
  <line class="arrow" x1="305" y1="220" x2="1040" y2="220"/>
  <text class="label" x="672" y="207">Discover protected resource metadata</text>
  <line class="arrow" x1="1040" y1="265" x2="305" y2="265"/>
  <text class="small-label" x="672" y="252">Return Microsoft Entra ID as the authorization server</text>

  <circle class="step" cx="315" cy="315" r="15"/>
  <text class="step-text" x="315" y="315">3</text>
  <line class="arrow" x1="305" y1="335" x2="540" y2="335"/>
  <text class="small-label" x="422" y="308">
    <tspan x="422" dy="0">Send authorization request</tspan>
    <tspan x="422" dy="19">client_id = CIMD URL</tspan>
  </text>

  <circle class="step" cx="550" cy="370" r="15"/>
  <text class="step-text" x="550" y="370">4</text>
  <line class="arrow" x1="560" y1="405" x2="795" y2="405"/>
  <text class="label" x="677" y="392">Retrieve metadata document</text>
  <line class="arrow" x1="795" y1="450" x2="560" y2="450"/>
  <text class="label" x="677" y="437">Return OAuth client metadata</text>

  <circle class="step" cx="570" cy="500" r="15"/>
  <text class="step-text" x="570" y="500">5</text>
  <rect class="action" x="435" y="525" width="230" height="95"/>
  <text class="action-text" x="550" y="550">
    <tspan x="550" dy="0">Validate the document,</tspan>
    <tspan x="550" dy="20">redirect URI, and policy</tspan>
    <tspan x="550" dy="20">Derive a stable app ID</tspan>
    <tspan x="550" dy="20">and find the agent identity</tspan>
  </text>

  <circle class="step" cx="530" cy="660" r="15"/>
  <text class="step-text" x="530" y="660">6</text>
  <line class="arrow" x1="540" y1="680" x2="110" y2="680"/>
  <text class="label" x="325" y="667">Request consent if required</text>
  <line class="arrow" x1="110" y1="725" x2="540" y2="725"/>
  <text class="label" x="325" y="712">Approve under tenant policy</text>

  <circle class="step" cx="570" cy="760" r="15"/>
  <text class="step-text" x="570" y="760">7</text>
  <rect class="action" x="450" y="785" width="200" height="50"/>
  <text class="action-text" x="550" y="815">Create agent identity if needed</text>

  <circle class="step" cx="550" cy="850" r="15"/>
  <text class="step-text" x="550" y="850">8</text>
  <line class="arrow" x1="540" y1="880" x2="305" y2="880"/>
  <text class="small-label" x="422" y="867">Issue audience-restricted access token</text>

  <circle class="step" cx="1010" cy="860" r="15"/>
  <text class="step-text" x="1010" y="860">9</text>
  <line class="arrow" x1="305" y1="910" x2="1040" y2="910"/>
  <text class="label" x="672" y="897">Call MCP server with the access token</text>
</svg>
